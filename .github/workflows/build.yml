name: Build

# Compiles the iOS app on a cloud Mac (no signing needed) on every push.
# Free and unlimited because the repo is public.
on:
  # Feature branches are built through their PR (one run per change, not two);
  # pushes to main are built directly.
  push:
    branches: [main]
    paths:
      - "PointAndShoot/**"
      - "PointAndShootWidgets/**"
      - "PointAndShootLockedCapture/**"
      - "Shared/**"
      - "Config/**"
      - "PointAndShootUITests/**"
      - "PointAndShoot.xcodeproj/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Mac does everything: macOS runners are scarce, so each extra job is another wait
  # in the queue. Compile for a real iPhone first (fast; catches device-only issues), then
  # run the simulator UI tests on the same machine.
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      # Just pick it; xcodebuild boots it. (Booting it ourselves in parallel raced the
      # test-runner install and starved the compile of CPU.)
      - name: Pick simulator
        run: echo "SIM=$(python3 .github/scripts/pick-simulator.py)" >> "$GITHUB_ENV"

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PointAndShoot.xcodeproj \
            -target PointAndShoot \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Compile errors
        if: failure()
        run: |
          echo "## Compile errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -100 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -100

      # Xcode 26 compilation cache (content-addressed, so fresh-checkout timestamps don't
      # force a full rebuild), persisted between runs with GitHub's standard cache action.
      - uses: actions/cache@v4
        with:
          path: build/ui/CompilationCache.noindex
          key: xcc-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: xcc-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build for simulator tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PointAndShoot.xcodeproj \
            -scheme PointAndShoot \
            -destination "id=$SIM" \
            -derivedDataPath build/ui \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildTimingSummary \
            2>&1 | tee uibuild.log | grep -E --line-buffered "error:|(TEST )?BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "(TEST )?BUILD SUCCEEDED" uibuild.log
          echo "## Simulator build timing" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Build Timing Summary/,$p' uibuild.log | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh build/ui/CompilationCache.noindex 2>/dev/null || echo "no compilation cache dir"

      # The first launch on a cold simulator sometimes times out ("Failed to launch … Timed
      # out"), failing whichever test runs first. Boot it and launch the app once after the
      # build (booting during the build raced the test runner's install), then quit it.
      - name: Warm up simulator
        run: |
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b >/dev/null
          APP=build/ui/Build/Products/Debug-iphonesimulator/PointAndShoot.app
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$SIM" "$APP"
          # The Photos integration tests and the roll UI tests use the simulator's real
          # library: grant access up front so no permission prompt blocks them.
          xcrun simctl privacy "$SIM" grant photos "$BID" || true
          xcrun simctl privacy "$SIM" grant photos-add "$BID" || true
          xcrun simctl launch "$SIM" "$BID" -uitest >/dev/null || true
          sleep 8
          xcrun simctl terminate "$SIM" "$BID" || true

      # Unit tests (PointAndShootTests: settings, recipes, capture planner, roll logic, the
      # film pipeline, and Photos-library integration), then the UI tests: the real UI in the
      # iOS Simulator (no camera there; `-uitest` skips the session), off-center taps, and the
      # roll's viewer/grid/delete flows against seeded photos.
      # TEST_RUNNER_CI makes the integration tests fail (not skip) if Photos access is missing.
      - name: Tests (simulator)
        run: |
          set -o pipefail
          TEST_RUNNER_CI=1 xcodebuild test-without-building \
            -project PointAndShoot.xcodeproj \
            -scheme PointAndShoot \
            -destination "id=$SIM" \
            -derivedDataPath build/ui \
            -resultBundlePath build/UITests.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee uitest.log | grep -E --line-buffered "error:|Test [Cc]ase .*(passed|failed)|TEST (EXECUTE )?(SUCCEEDED|FAILED)" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" uitest.log

      - name: Test summary
        if: always()
        run: |
          [ -f uitest.log ] || exit 0
          echo "## Tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Test [Cc]ase .*(passed|failed)|error:|TEST (EXECUTE )?(SUCCEEDED|FAILED)" uitest.log | sed "s|$GITHUB_WORKSPACE/||" | head -200 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: |
            uitest.log
            build/UITests.xcresult
